[tasks.install]
run = "pnpm install --filter github --frozen-lockfile"

[tasks.format]
env._.path = "./node_modules/.bin"
run = "prettier --check ."

[tasks."format-fix"]
env._.path = "./node_modules/.bin"
run = "prettier --write ."

[tasks."lint:fork-workflow"]
description = "Validate the personal Android workflow"
run = "mise x github:rhysd/actionlint@1.7.7 -- actionlint workflows/fork-android.yml"
