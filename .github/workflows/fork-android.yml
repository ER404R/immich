name: Fork Android

on:
  push:
    branches: [personal]
  pull_request:
    branches: [personal]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/personal' }}

jobs:
  check-and-build:
    if: github.repository == 'ER404R/immich'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@caac7f7e4298458a14238959504f411fc6cc7f06
        with:
          github_token: ${{ github.token }}
          working_directory: ./mobile

      - name: Validate workflow
        run: mise //.github:lint:fork-workflow

      - name: Test upstream release sync
        run: mise //.github:test:release-sync

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - name: Install dependencies
        run: mise //mobile:install:ci

      - name: Generate code
        run: mise //mobile:codegen

      - name: Analyze Dart
        run: mise //mobile:analyze:dart

      - name: Check Dart formatting
        run: mise //mobile:format

      - name: Run mobile tests
        run: mise //mobile:test

      - name: Run native tests
        run: mise //native:test

      - name: Set fork version
        if: github.ref == 'refs/heads/personal' && github.event_name != 'pull_request'
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          upstream_version=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' mobile/pubspec.yaml)
          test -n "$upstream_version"
          test "$RUN_ATTEMPT" -lt 100
          build_number=$((RUN_NUMBER * 100 + RUN_ATTEMPT))
          test "$build_number" -le 2100000000
          version="${upstream_version}-fork.${RUN_NUMBER}.${RUN_ATTEMPT}"
          echo "FORK_VERSION=$version" >> "$GITHUB_ENV"
          echo "FORK_BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore signing key
        if: github.ref == 'refs/heads/personal' && github.event_name != 'pull_request'
        env:
          KEY_JKS: ${{ secrets.KEY_JKS }}
        run: |
          test -n "$KEY_JKS" || { echo 'Set the Android signing secrets described in FORK.md.'; exit 1; }
          umask 077
          printf '%s' "$KEY_JKS" | base64 --decode > mobile/android/key.jks
          test -s mobile/android/key.jks

      - name: Build signed ARM64 APK
        if: github.ref == 'refs/heads/personal' && github.event_name != 'pull_request'
        env:
          ALIAS: ${{ secrets.ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: mise //mobile:build:fork-apk

      - name: Verify ARM64 APK
        if: github.ref == 'refs/heads/personal' && github.event_name != 'pull_request'
        run: mise //mobile:verify:fork-apk

      - name: Remove signing key
        if: always()
        run: rm -f mobile/android/key.jks

      - name: Upload APK
        if: github.ref == 'refs/heads/personal' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fork-apk
          path: mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 7

  release:
    needs: check-and-build
    if: github.ref == 'refs/heads/personal' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: fork-apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check-and-build.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          mv app-arm64-v8a-release.apk immich-er404r.apk
          gh release create "$VERSION" immich-er404r.apk --target "$COMMIT" --title "$VERSION" --notes '' --latest
